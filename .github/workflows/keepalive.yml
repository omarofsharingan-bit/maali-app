name: Keep Render awake
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes — GitHub delays cron runs, so keep margin under Render's ~15-min sleep threshold
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -s --max-time 60 https://maali-app.onrender.com/api/health || true
